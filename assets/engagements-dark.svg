<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI product rescue, Stripe integrations, AI document pipelines, backend and performance">
<style>
.f{opacity:0;animation:fi .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.scan{stroke-dasharray:120 1200;animation:scan 6s linear infinite}
@keyframes scan{from{stroke-dashoffset:1320}to{stroke-dashoffset:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){
  .f,.grow,.scan,.pulse,.rot,.hl,.wave,.float{animation:none!important;opacity:1!important;transform:none!important}
  .rot2,.rot3{display:none}
}
</style>
<rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="none" stroke="#3d444d"/>
<g class="f" style="animation-delay:0.10s"><rect x="32" y="32" width="552" height="140" rx="12" fill="#151b23" stroke="#3d444d"/></g>
<rect x="32" y="32" width="4" height="140" rx="2" fill="#4493f8" class="f" style="animation-delay:0.20s"/>
<g class="f" style="animation-delay:0.20s"><text x="60.0" y="70.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4493f8" text-anchor="start" style="fill:#4493f8">01</text><text x="94.0" y="70.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">AI product rescue</text></g>
<g class="f" style="animation-delay:0.30s"><text x="60.0" y="104.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Take AI-built, vibe-coded or stalled SaaS to reliable production:</text></g>
<g class="f" style="animation-delay:0.35s"><text x="60.0" y="126.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">auth, data model, tests, deploys and monitoring.</text></g>
<g class="f" style="animation-delay:0.25s"><rect x="616" y="32" width="552" height="140" rx="12" fill="#151b23" stroke="#3d444d"/></g>
<rect x="616" y="32" width="4" height="140" rx="2" fill="#ab7df8" class="f" style="animation-delay:0.35s"/>
<g class="f" style="animation-delay:0.35s"><text x="644.0" y="70.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4493f8" text-anchor="start" style="fill:#ab7df8">02</text><text x="678.0" y="70.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Stripe integrations</text></g>
<g class="f" style="animation-delay:0.45s"><text x="644.0" y="104.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Connect marketplaces, subscription billing, invoicing and Terminal /</text></g>
<g class="f" style="animation-delay:0.50s"><text x="644.0" y="126.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Tap to Pay, designed by a certified architect.</text></g>
<g class="f" style="animation-delay:0.40s"><rect x="32" y="196" width="552" height="140" rx="12" fill="#151b23" stroke="#3d444d"/></g>
<rect x="32" y="196" width="4" height="140" rx="2" fill="#4493f8" class="f" style="animation-delay:0.50s"/>
<g class="f" style="animation-delay:0.50s"><text x="60.0" y="234.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4493f8" text-anchor="start" style="fill:#4493f8">03</text><text x="94.0" y="234.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">AI document pipelines</text></g>
<g class="f" style="animation-delay:0.60s"><text x="60.0" y="268.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">OCR and LLM extraction with validation, human review and cost controls</text></g>
<g class="f" style="animation-delay:0.65s"><text x="60.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">for document-heavy workflows.</text></g>
<g class="f" style="animation-delay:0.55s"><rect x="616" y="196" width="552" height="140" rx="12" fill="#151b23" stroke="#3d444d"/></g>
<rect x="616" y="196" width="4" height="140" rx="2" fill="#ab7df8" class="f" style="animation-delay:0.65s"/>
<g class="f" style="animation-delay:0.65s"><text x="644.0" y="234.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4493f8" text-anchor="start" style="fill:#ab7df8">04</text><text x="678.0" y="234.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Backend and performance</text></g>
<g class="f" style="animation-delay:0.75s"><text x="644.0" y="268.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Laravel and Node.js systems, SQL tuning, queues and server cost</text></g>
<g class="f" style="animation-delay:0.80s"><text x="644.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">reduction for products outgrowing their stack.</text></g>
