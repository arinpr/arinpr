<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="UXD CRM: SaaS CRM and recruitment CRM built for high-volume lead handling, interview scheduling and visual reporting.">
<style>
.f{opacity:0;animation:fi .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.scan{stroke-dasharray:120 1200;animation:scan 6s linear infinite}
@keyframes scan{from{stroke-dashoffset:1320}to{stroke-dashoffset:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){
  .f,.grow,.scan,.pulse,.rot,.hl,.wave,.float{animation:none!important;opacity:1!important;transform:none!important}
  .rot2,.rot3{display:none}
}
</style>
<rect x="0.5" y="0.5" width="589" height="229" rx="12" fill="none" stroke="#3d444d"/>
<line x1="12" y1="0.8" x2="578" y2="0.8" stroke="#4493f8" stroke-width="2" class="scan" style="animation-delay:2.8s"/>
<g class="f" style="animation-delay:0.05s"><text x="28.0" y="40.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#656c76" text-anchor="start" letter-spacing="1.4">SAAS  ·  CRM</text></g>
<g class="f" style="animation-delay:0.15s"><text x="28.0" y="76.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">UXD CRM</text></g>
<g class="f" style="animation-delay:0.25s"><text x="28.0" y="108.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">SaaS CRM and recruitment CRM built for high-volume lead handling,</text></g>
<g class="f" style="animation-delay:0.30s"><text x="28.0" y="130.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">interview scheduling and visual reporting.</text></g>
<g class="f" style="animation-delay:0.45s"><rect x="28.0" y="180" width="68.6" height="26" rx="13" fill="#151b23" stroke="#3d444d"/><text x="62.3" y="197.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0f6fc" text-anchor="middle">Laravel</text></g>
<g class="f" style="animation-delay:0.51s"><rect x="104.6" y="180" width="55.3" height="26" rx="13" fill="#151b23" stroke="#3d444d"/><text x="132.3" y="197.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0f6fc" text-anchor="middle">MySQL</text></g>
<g class="f" style="animation-delay:0.57s"><rect x="167.9" y="180" width="81.9" height="26" rx="13" fill="#151b23" stroke="#3d444d"/><text x="208.9" y="197.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0f6fc" text-anchor="middle">Reporting</text></g>
</svg>
